<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Digit@Kids</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Roboto', Arial, sans-serif;
  margin: 0;
  padding: 40px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  background: url('https://images.unsplash.com/photo-1593642634367-d91a135587b5?auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
  background-size: cover;
  position: relative;
}
body::after {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  z-index: 0;
  pointer-events: none;
}
h1 {
  font-size: 60px;
  text-transform: uppercase;
  text-align: left;
  margin: 0 0 30px 0;
  z-index: 1;
  position: relative;
  display: flex;
  align-items: center;
}
h1 span {
  font-weight: bold;
}
h1 span:nth-child(1) { color:#ff5252; }
h1 span:nth-child(2) { color:#ff9800; }
h1 span:nth-child(3) { color:#ffeb3b; }
h1 span:nth-child(4) { color:#4caf50; }
h1 span:nth-child(5) { color:#2196f3; }
h1 span:nth-child(6) { color:#9c27b0; }
h1 span:nth-child(7) { color:#ff5252; }
h1 span:nth-child(8) { color:#ff9800; }
h1 span:nth-child(9) { color:#4caf50; }
h1 span:nth-child(10){ color:#2196f3; }
h1 img {
  height: 130px;
  vertical-align: middle;
  margin-left: 15px;
  border-radius: 10px;
}
#texto {
  max-width: 900px;
  width: 100%;
  background: white;
  padding: 30px;
  font-size: 22px;
  line-height: 1.8;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.2);
  margin-bottom: 25px;
  min-height: 220px;
  overflow-y: auto;
  z-index: 1;
  position: relative;
}
#campo {
  font-size: 24px;
  font-weight: bold;
  padding: 15px;
  width: 90%;
  max-width: 900px;
  min-height: 80px;
  border-radius: 15px;
  border: 2px solid #ccc;
  box-shadow: inset 0 3px 6px rgba(0,0,0,0.1);
  outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
  resize: vertical;
  background: #f9f9f9;
  z-index: 1;
  position: relative;
}
#campo:focus {
  border-color: #4CAF50;
  box-shadow: 0 0 12px rgba(76,175,80,0.4);
}
#info {
  margin-top: 20px;
  font-size: 18px;
  color: #fff;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  z-index: 1;
  position: relative;
}
button {
  margin-top: 25px;
  padding: 15px 30px;
  font-size: 30px;
  cursor: pointer;
  border: none;
  border-radius: 12px;
  background: linear-gradient(90deg,#4CAF50,#81C784);
  color: white;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  transition: background 0.3s, transform 0.2s;
  z-index: 1;
  position: relative;
}
button:hover {
  background: linear-gradient(90deg,#43a047,#66BB6A);
  transform: translateY(-2px);
}
#progresso {
  margin-top: 20px;
  max-width: 900px;
  width: 90%;
  height: 20px;
  background: #ddd;
  border-radius: 10px;
  overflow: hidden;
  z-index: 1;
  position: relative;
}
#barra {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#4CAF50,#81C784);
  transition: width 0.2s ease-in-out;
}
#rodape {
  margin-top: 25px;
  font-size: 16px;
  color: #fff;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  text-align: center;
  z-index: 1;
  position: relative;
}
.correto { color: #4CAF50; }
.errado { color: #F44336; background: #ffe5e5; }
@keyframes pulse {0% { transform: scale(1);}50% { transform: scale(1.2);}100% { transform: scale(1);}}
@keyframes shake {0% { transform: translateX(0);}25% { transform: translateX(-3px);}50% { transform: translateX(3px);}75% { transform: translateX(-3px);}100% { transform: translateX(0);}}
@media (max-width:600px){
  h1{ font-size:40px; } 
  #texto{ font-size:18px; padding:20px; min-height:160px;}
  #campo{ font-size:20px; padding:12px; min-height:60px; width:95%;}
}
</style>
</head>
<body>

<h1>
  <span>D</span><span>I</span><span>G</span><span>I</span><span>T</span><span>@</span><span>K</span><span>I</span><span>D</span><span>S</span>
  <img src="crianca.png" alt="Criança a digitar">
</h1>

<div id="texto"></div>
<textarea id="campo" placeholder="🖊️ Começa a digitar e diverte-te!"></textarea>

<div id="info">
Tempo: <span id="tempo">0</span>s | Erros: <span id="erros">0</span>
</div>

<div id="progresso"><div id="barra"></div></div>
<button onclick="novoTexto()">NOVO TEXTO</button>

<div id="rodape">
  Desenvolvido por MÁRIO MENEZES | 👀
  <img src="https://api.countapi.xyz/hit/digitakids-sudo/visitas" alt="visitas">
</div>

<script>
const textos=[
"O João foi à escola numa manhã de primavera. Levava a mochila cheia de livros e lápis. A professora pediu aos alunos que escrevessem uma pequena história sobre o que gostam de fazer nos tempos livres. Alguns alunos falaram de futebol, outros de ler livros ou brincar no parque perto de casa. Todos tentaram escrever com atenção para não cometer erros.",
"Na biblioteca da escola existem muitos livros interessantes. Os alunos gostam de entrar, escolher um livro e sentar-se em silêncio a ler. Ler ajuda a aprender palavras novas e a imaginar histórias diferentes. A professora diz sempre que quem lê muito escreve melhor e aprende mais depressa. Ler é divertido e ajuda a concentração.",
"No recreio os alunos brincam, correm e conversam. Alguns gostam de jogar à bola, outros preferem conversar ou saltar à corda. O recreio é um momento importante do dia porque permite descansar um pouco antes de voltar às aulas e continuar a aprender coisas novas. É também uma forma de socializar e fazer amigos.",
"A Marta gosta de desenhar no caderno durante o tempo livre. Ela escolhe cores vibrantes e cria imagens de animais, flores e paisagens. Muitas vezes mostra os seus desenhos aos colegas que ficam encantados. Desenhar ajuda a Marta a relaxar e também a desenvolver a criatividade e a coordenação motora.",
"O Miguel aprendeu novas palavras lendo um livro sobre animais. Ele pratica a escrita e tenta lembrar-se de cada palavra corretamente. Ler e escrever ajuda o Miguel a comunicar melhor com os amigos e a professora, tornando o estudo mais divertido e interessante. A leitura desperta a imaginação e cria histórias na mente das crianças."
];

let textoAtual="";
let inicio=null;
let erros=0;
const textoDiv=document.getElementById("texto");
const campo=document.getElementById("campo");
const barra=document.getElementById("barra");

function mostrarTexto(){
  textoDiv.innerHTML="";
  for(let letra of textoAtual){
    let span=document.createElement("span");
    span.textContent=letra;
    textoDiv.appendChild(span);
  }
}

function atualizarProgresso(valor){
  let perc=(valor/textoAtual.length)*100;
  barra.style.width=perc+"%";
}

function novoTexto(){
  textoAtual=textos[Math.floor(Math.random()*textos.length)];
  erros=0;
  inicio=null;
  campo.value="";
  document.getElementById("erros").textContent=0;
  document.getElementById("tempo").textContent=0;
  atualizarProgresso(0);
  mostrarTexto();
  campo.focus();
}

campo.addEventListener("input",function(){
  if(!inicio) inicio=new Date();
  let valor=campo.value;
  let spans=textoDiv.querySelectorAll("span");
  erros=0;
  for(let i=0;i<spans.length;i++){
    let letra=valor[i];
    if(letra==null){ spans[i].className=""; }
    else if(letra===spans[i].textContent){ spans[i].className="correto"; }
    else{ spans[i].className="errado"; erros++; }
  }
  document.getElementById("erros").textContent=erros;
  atualizarProgresso(valor.length);
});

setInterval(function(){
  if(inicio){
    let tempo=Math.floor((new Date()-inicio)/1000);
    document.getElementById("tempo").textContent=tempo;
  }
},1000);

novoTexto();
</script>

</body>
</html>
