<!DOCTYPE html>
<html lang="pt">
<head>

<title>Digit@Kids</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Roboto',Arial;
  margin:0;
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
  background:url('https://images.unsplash.com/photo-1593642634367-d91a135587b5?auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
  background-size:cover;
  position:relative;
}

body::after{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:rgba(0,0,0,0.4);
  z-index:0;
}

/* CABEÇALHO - título + créditos */
.cabecalho{
  width:95%;
  max-width:1200px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  z-index:1;
  position:relative;
}

.titulo{
  font-size:80px;
  margin:0;
  text-shadow:2px 2px 5px black;
  display:flex;
  align-items:center;
}

.titulo span{
  font-weight:bold;
}

.titulo span:nth-child(1){color:#ff5252;}
.titulo span:nth-child(2){color:#ff9800;}
.titulo span:nth-child(3){color:#ffeb3b;}
.titulo span:nth-child(4){color:#4caf50;}
.titulo span:nth-child(5){color:#2196f3;}
.titulo span:nth-child(6){color:#9c27b0;}
.titulo span:nth-child(7){color:#ff5252;}
.titulo span:nth-child(8){color:#ff9800;}
.titulo span:nth-child(9){color:#4caf50;}
.titulo span:nth-child(10){color:#2196f3;}

.titulo img{
  height:130px;
  margin-left:15px;
  border-radius:10px;
  vertical-align:middle;
  position:relative;
  top:-5px;
}

#rodape{
  font-size:20px;
  color:white;
  text-shadow:1px 1px 2px black;
}

/* TEXTO */

#texto{
  max-width:1100px;
  width:95%;
  background:white;
  padding:40px;
  font-size:24px;
  line-height:1,7;
  border-radius:25px;
  box-shadow:0 20px 40px rgba(0,0,0,0.25);
  margin-bottom:20px;
  min-height:280px;
  overflow-y:auto;
  z-index:1;
  position:relative;
}

/* CAMPO DIGITAÇÃO */

#campo{
  font-size:26px;
  font-weight:bold;
  padding:30px;
  width:95%;
  max-width:1100px;
  min-height:150px;
  border-radius:30px;
  border:5px solid #ccc;
  outline:none;
  resize:vertical;
  background:#f9f9f9;
  z-index:1;
  position:relative;
}

#campo:focus{
  border-color:#000000;
  box-shadow:0 0 12px rgba(76,175,80,0.5);
}

/* INFO */

#info{
  margin-top:20px;
  font-size:20px;
  color:white;
  text-shadow:1px 1px 2px black;
  z-index:1;
  position:relative;
}

/* BOTAO */

button{
  margin-top:25px;
  padding:15px 35px;
  font-size:28px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#4CAF50,#81C784);
  color:white;
  cursor:pointer;
  z-index:1;
  position:relative;
}

button:hover{
  transform:scale(1.05);
}

/* BARRA PROGRESSO */

#progresso{
  margin-top:20px;
  width:95%;
  max-width:1100px;
  height:25px;
  background:#ddd;
  border-radius:10px;
  overflow:hidden;
  z-index:1;
  position:relative;
}

#barra{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#4CAF50,#81C784);
}

/* CORES LETRAS */

.correto{
  color:#4CAF50;
}

.errado{
  color:#F44336;
  background:#ffe5e5;
}

/* RESULTADO FINAL */

#resultado{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#caixaResultado{
  background:white;
  padding:50px;
  border-radius:25px;
  text-align:center;
  max-width:500px;
}

#caixaResultado h2{
  font-size:40px;
  color:#4CAF50;
}

#caixaResultado p{
  font-size:24px;
  margin:25px 0;
}

</style>
</head>

  "Os animais fazem parte do nosso planeta e são muito importantes para a natureza e para as pessoas. Existem muitos tipos de animais, como cães, gatos, pássaros, peixes, coelhos e cavalos. Cada animal é diferente e tem características próprias. Alguns são grandes, outros são pequenos; alguns vivem na terra, outros na água ou no ar. Muitos animais vivem nas nossas casas e tornam-se animais de estimação. Os cães são conhecidos por serem fiéis e gostam de brincar, correr e passear com os donos. Os gatos são mais tranquilos e gostam de dormir em lugares quentinhos e confortáveis. Ter um animal de estimação pode trazer muita alegria à família.Também existem animais que vivem na natureza, como nas florestas, nos rios e no mar. Cada um tem uma forma diferente de viver e de se alimentar. Alguns comem plantas e outros comem carne.Cuidar bem dos animais é muito importante. Devemos respeitá-los, protegê-los e garantir que tenham comida, água e um lugar seguro para viver. Assim, eles podem crescer saudáveis e felizes.",

"As plantas são seres vivos muito importantes para o nosso planeta. Elas crescem em diferentes lugares, como florestas, campos, jardins e até dentro de casa. Para crescerem bem, as plantas precisam de água, luz do sol, ar e nutrientes da terra. Muitas plantas produzem frutos e sementes que servem de alimento para pessoas e animais. As árvores também ajudam a limpar o ar e a produzir oxigénio, que é essencial para a respiração dos seres vivos. Além disso, dão sombra e ajudam a manter o solo protegido. Cuidar das plantas é uma forma de proteger a natureza. Regar, plantar árvores e não destruir os espaços verdes são atitudes que ajudam o ambiente.",

"O corpo humano é formado por muitas partes que trabalham juntas para nos manter vivos e saudáveis. Temos órgãos importantes como o coração, os pulmões, o cérebro e o estômago. O coração bombeia o sangue por todo o corpo. Os pulmões ajudam-nos a respirar e a obter oxigénio do ar. O cérebro controla os nossos pensamentos, movimentos e sentimentos. Para cuidar bem do corpo devemos ter hábitos saudáveis. Comer alimentos variados, beber água, dormir o suficiente e praticar exercício físico são atitudes importantes. Também devemos manter uma boa higiene, lavando as mãos e escovando os dentes diariamente. Quando cuidamos bem do nosso corpo conseguimos crescer fortes e com mais energia para aprender e brincar.",

"Os animais são seres vivos que fazem parte da natureza. Existem muitos tipos de animais com tamanhos, formas e hábitos diferentes. Alguns vivem na terra, como os cães, os elefantes e os cavalos. Outros vivem na água, como os peixes, os golfinhos e as baleias. Também existem animais que voam, como as aves. Cada animal tem características que o ajudam a sobreviver no seu habitat. Alguns alimentam-se de plantas e outros de outros animais. Muitos animais vivem na natureza, mas alguns convivem com as pessoas como animais de estimação. Devemos tratar todos os animais com respeito e proteger os seus habitats naturais.",

"A alimentação saudável é muito importante para o crescimento e desenvolvimento das crianças. O nosso corpo precisa de diferentes tipos de alimentos para funcionar bem. As frutas e os legumes são ricos em vitaminas e ajudam a proteger o corpo contra doenças. Os cereais e o pão fornecem energia para as atividades do dia. O leite, o peixe e os ovos ajudam a fortalecer os ossos e os músculos. Beber água também é essencial para manter o corpo hidratado. Devemos evitar comer demasiados doces e alimentos muito gordurosos. Uma alimentação equilibrada ajuda-nos a ter energia para estudar, brincar e crescer de forma saudável.",

"A escola é um lugar onde as crianças aprendem e descobrem muitas coisas novas. Na escola aprendemos a ler, escrever, contar e a compreender melhor o mundo que nos rodeia. Os professores ajudam os alunos a desenvolver conhecimentos e capacidades importantes. Também aprendemos a trabalhar em grupo, a respeitar os colegas e a partilhar ideias. A escola é um espaço de aprendizagem, mas também de amizade e convivência. Participar nas atividades, fazer perguntas e prestar atenção nas aulas ajuda a aprender melhor. A educação é muito importante porque prepara as crianças para o futuro e para a vida em sociedade.",

"A reciclagem é uma forma de proteger o ambiente e reduzir o lixo. Quando reciclamos, separamos os resíduos para que possam ser reutilizados ou transformados em novos produtos. Materiais como papel, plástico, vidro e metal podem ser reciclados. Para facilitar a separação existem ecopontos com cores diferentes. O azul é para papel e cartão, o amarelo para plástico e metal e o verde para vidro. Reciclar ajuda a poupar recursos naturais e energia. Também reduz a quantidade de lixo que vai para os aterros. Se cada pessoa fizer a sua parte, será possível manter o planeta mais limpo e saudável para todos.",

"O sistema solar é formado pelo Sol e por vários planetas que giram à sua volta. A Terra é um desses planetas. Existem também outros planetas como Marte, Júpiter, Saturno e Vénus. Cada planeta tem características diferentes. Alguns são muito quentes e outros muito frios. O Sol está no centro do sistema solar e é a principal fonte de luz e energia. Os planetas movem-se em órbitas à volta do Sol. Estudar o sistema solar ajuda-nos a compreender melhor o espaço e o lugar onde o nosso planeta se encontra no universo.",

"As profissões fazem parte da vida das pessoas e ajudam a sociedade a funcionar. Existem muitas profissões diferentes, como médicos, professores, agricultores, bombeiros e engenheiros. Cada profissão tem tarefas e responsabilidades específicas. Os médicos cuidam da saúde das pessoas, os professores ensinam nas escolas e os bombeiros ajudam em situações de emergência. Todas as profissões são importantes porque contribuem para o bem-estar da comunidade. Quando as crianças crescem podem escolher uma profissão de acordo com os seus interesses e capacidades.",

let textoAtual="";
let inicio=null;
let erros=0;

const textoDiv=document.getElementById("texto");
const campo=document.getElementById("campo");
const barra=document.getElementById("barra");

function mostrarTexto(){
  textoDiv.innerHTML="";
  for(let letra of textoAtual){
    let span=document.createElement("span");
    span.textContent=letra;
    textoDiv.appendChild(span);
  }
}

function atualizarProgresso(valor){
  let perc=(valor/textoAtual.length)*100;
  barra.style.width=perc+"%";
}

function novoTexto(){
  document.getElementById("resultado").style.display="none";
  textoAtual=textos[Math.floor(Math.random()*textos.length)];
  erros=0;
  inicio=null;
  campo.value="";
  document.getElementById("erros").textContent=0;
  document.getElementById("tempo").textContent=0;
  atualizarProgresso(0);
  mostrarTexto();
  campo.focus();
}

campo.addEventListener("input",function(){
  if(!inicio) inicio=new Date();
  let valor=campo.value;
  let spans=textoDiv.querySelectorAll("span");
  erros=0;
  for(let i=0;i<spans.length;i++){
    let letra=valor[i];
    if(letra==null){
      spans[i].className="";
    }
    else if(letra===spans[i].textContent){
      spans[i].className="correto";
    }
    else{
      spans[i].className="errado";
      erros++;
    }
  }
  document.getElementById("erros").textContent=erros;
  atualizarProgresso(valor.length);

  if(valor.length===textoAtual.length){
    let tempo=Math.floor((new Date()-inicio)/1000);
    let estrelas="⭐";
    if(erros==0) estrelas="⭐⭐⭐ Excelente!";
    else if(erros<5) estrelas="⭐⭐ Muito bem!";
    else estrelas="⭐ Continua a treinar!";
    let mensagem="Tempo: "+tempo+" segundos<br>Erros: "+erros+"<br><br>Resultado: "+estrelas;
    document.getElementById("mensagemFinal").innerHTML=mensagem;
    document.getElementById("resultado").style.display="flex";
  }
});

setInterval(function(){
  if(inicio){
    let tempo=Math.floor((new Date()-inicio)/1000);
    document.getElementById("tempo").textContent=tempo;
  }
},1000);

novoTexto();
</script>

</body>
</html>
