<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Reservado</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: black;
      font-family: Arial, sans-serif;
      color: white;

      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
    }

    .login-box {
      background-color: #111;
      padding: 40px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 0 20px rgba(255,255,255,0.1);
      text-align: center;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: none;
      border-radius: 6px;
      background-color: #222;
      color: white;
      font-size: 14px;
    }

    input::placeholder {
      color: #999;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background-color: #444;
      color: white;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #666;
    }

    .footer {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>Acesso Reservado para utilizadores registados.</h1>

    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">

    <button>Entrar</button>
  </div>

  <div class="footer">
    Desenvolvido por professor Mário Menezes |
    Email: mario_menezes2009@edu.madeira.gov.pt
  </div>

</body>
</html>
