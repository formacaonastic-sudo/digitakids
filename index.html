<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Digit@Kids</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Roboto',Arial;
  margin:0;
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
  background:url('https://images.unsplash.com/photo-1593642634367-d91a135587b5?auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
  background-size:cover;
  position:relative;
}
body::after{
  content:"";
  position:absolute;
  top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.4);
  z-index:0;
}

/* CABEÇALHO */
.cabecalho{
  width:95%;
  max-width:1200px;
  display:flex;
  justify-content:center;
  margin-bottom:20px;
  z-index:1;
  position:relative;
}
.titulo{
  font-size:80px;
  margin:0;
  text-shadow:2px 2px 5px black;
  display:flex;
  align-items:center;
}
.titulo span{ font-weight:bold; }
.titulo span:nth-child(1){color:#ff5252;}
.titulo span:nth-child(2){color:#ff9800;}
.titulo span:nth-child(3){color:#ffeb3b;}
.titulo span:nth-child(4){color:#4caf50;}
.titulo span:nth-child(5){color:#2196f3;}
.titulo span:nth-child(6){color:#9c27b0;}
.titulo span:nth-child(7){color:#ff5252;}
.titulo span:nth-child(8){color:#ff9800;}
.titulo span:nth-child(9){color:#4caf50;}
.titulo span:nth-child(10){color:#2196f3;}
.titulo img{
  height:130px;
  margin-left:15px;
  border-radius:10px;
  vertical-align:middle;
  position:relative;
  top:-5px;
}

/* RODAPÉ */
#rodape{
  font-size:20px;
  color:white;
  text-shadow:1px 1px 2px black;
  margin-top:30px;
  text-align:center;
  z-index:1;
  position:relative;
}

/* TEXTO */
#texto{
  max-width:1100px;
  width:95%;
  background:white;
  padding:40px;
  font-size:28px;
  line-height:1.7;
  border-radius:25px;
  box-shadow:0 20px 40px rgba(0,0,0,0.25);
  margin-bottom:20px;
  min-height:280px;
  overflow-y:auto;
  z-index:1;
  position:relative;
}

/* CAMPO DIGITAÇÃO */
#campo{
  font-size:26px;
  font-weight:bold;
  padding:30px;
  width:95%;
  max-width:1100px;
  min-height:150px;
  border-radius:30px;
  border:5px solid #ccc;
  outline:none;
  resize:vertical;
  background:#f9f9f9;
  z-index:1;
  position:relative;
}
#campo:focus{
  border-color:#000000;
  box-shadow:0 0 12px rgba(76,175,80,0.5);
}

/* INFO */
#info{
  margin-top:20px;
  font-size:20px;
  color:white;
  text-shadow:1px 1px 2px black;
  z-index:1;
  position:relative;
}

/* BOTÃO */
button{
  margin-top:25px;
  padding:15px 35px;
  font-size:28px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#4CAF50,#81C784);
  color:white;
  cursor:pointer;
  z-index:1;
  position:relative;
}
button:hover{ transform:scale(1.05); }

/* BARRA PROGRESSO */
#progresso{
  margin-top:20px;
  width:95%;
  max-width:1100px;
  height:25px;
  background:#ddd;
  border-radius:10px;
  overflow:hidden;
  z-index:1;
  position:relative;
}
#barra{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#4CAF50,#81C784);
}

/* CORES LETRAS */
.correto{ color:#4CAF50; }
.errado{ color:#F44336; background:#ffe5e5; }

/* RESULTADO FINAL */
#resultado{
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
#caixaResultado{
  background:white;
  padding:50px;
  border-radius:25px;
  text-align:center;
  max-width:500px;
}
#caixaResultado h2{ font-size:40px; color:#4CAF50; }
#caixaResultado p{ font-size:24px; margin:25px 0; }

</style>
</head>

<body>

<!-- CABEÇALHO -->
<div class="cabecalho">
  <h1 class="titulo">
    <span>D</span><span>I</span><span>G</span><span>I</span><span>T</span><span>@</span><span>K</span><span>I</span><span>D</span><span>S</span>
    <img src="crianca.png" alt="Criança a digitar">
  </h1>
</div>

<!-- TEXTO -->
<div id="texto"></div>

<!-- CAMPO DE DIGITAÇÃO -->
<textarea id="campo" placeholder="🖊️ Começa a digitar e diverte-te!"></textarea>

<!-- INFO -->
<div id="info">
Tempo: <span id="tempo">0</span>s | Erros: <span id="erros">0</span>
</div>

<!-- BARRA DE PROGRESSO -->
<div id="progresso">
  <div id="barra"></div>
</div>

<!-- BOTÃO NOVO TEXTO -->
<button onclick="novoTexto()">NOVO TEXTO</button>

<!-- RESULTADO FINAL -->
<div id="resultado">
  <div id="caixaResultado">
    <h2>🎉 Parabéns!</h2>
    <p id="mensagemFinal"></p>
    <button onclick="novoTexto()">JOGAR NOVAMENTE</button>
  </div>
</div>

<!-- RODAPÉ -->
<div id="rodape">
  Desenvolvido por MÁRIO MENEZES | 👀 Visitas: <span id="visits">0</span>
</div>

<script>
// Textos do jogo (mantive os teus)
const textos=[ /* ... teus textos aqui ... */ ];

let textoAtual="", inicio=null, erros=0;

const textoDiv=document.getElementById("texto");
const campo=document.getElementById("campo");
const barra=document.getElementById("barra");

function mostrarTexto(){
  textoDiv.innerHTML="";
  for(let letra of textoAtual){
    let span=document.createElement("span");
    span.textContent=letra;
    textoDiv.appendChild(span);
  }
}

function atualizarProgresso(valor){
  let perc=(valor/textoAtual.length)*100;
  barra.style.width=perc+"%";
}

function novoTexto(){
  document.getElementById("resultado").style.display="none";
  textoAtual=textos[Math.floor(Math.random()*textos.length)];
  erros=0; inicio=null; campo.value="";
  document.getElementById("erros").textContent=0;
  document.getElementById("tempo").textContent=0;
  atualizarProgresso(0);
  mostrarTexto();
  campo.focus();
}

campo.addEventListener("input",function(){
  if(!inicio) inicio=new Date();
  let valor=campo.value;
  let spans=textoDiv.querySelectorAll("span");
  erros=0;
  for(let i=0;i<spans.length;i++){
    let letra=valor[i];
    if(letra==null){ spans[i].className=""; }
    else if(letra===spans[i].textContent){ spans[i].className="correto"; }
    else{ spans[i].className="errado"; erros++; }
  }
  document.getElementById("erros").textContent=erros;
  atualizarProgresso(valor.length);

  if(valor.length===textoAtual.length){
    let tempo=Math.floor((new Date()-inicio)/1000);
    let estrelas="⭐";
    if(erros==0) estrelas="⭐⭐⭐ Excelente!";
    else if(erros<5) estrelas="⭐⭐ Muito bem!";
    else estrelas="⭐ Continua a treinar!";
    let mensagem="Tempo: "+tempo+" segundos<br>Erros: "+erros+"<br><br>Resultado: "+estrelas;
    document.getElementById("mensagemFinal").innerHTML=mensagem;
    document.getElementById("resultado").style.display="flex";
  }
});

setInterval(function(){
  if(inicio){
    let tempo=Math.floor((new Date()-inicio)/1000);
    document.getElementById("tempo").textContent=tempo;
  }
},1000);

novoTexto();

// --- CONTADOR DE VISITAS ---
fetch('https://api.countapi.xyz/hit/digitakids-sudo/visitas')
  .then(res => res.json())
  .then(res => {
    document.getElementById('visits').innerText = res.value;
  });

</script>
</body>
</html>
